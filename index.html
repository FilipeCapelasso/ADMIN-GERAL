<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f3f5;--cd:#fff;--tx:#17171c;--mu:#62626d;--bd:#e4e4ea;--r:#c80000;--ok:#1a8f4c;--wn:#b36b00;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d12;--cd:#16161d;--tx:#f1f1f4;--mu:#a4a4af;--bd:#2a2a34}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:980px;margin:0 auto;padding:0 14px}
header{background:#0d0d12;color:#fff;border-bottom:3px solid var(--r);padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px;position:sticky;top:0;z-index:20}
header .w{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header img{width:38px;height:38px;border-radius:9px;background:#fff;padding:4px}
header h1{font-size:17px;margin:0;flex:1;min-width:150px}header small{display:block;color:#c9c9d3;font-weight:400;font-size:12px}
button,select,input,textarea{font:inherit}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.red{background:var(--r);border-color:var(--r);color:#fff}.btn.sm{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.5}
header .btn{background:#1d1d26;border-color:#33333f;color:#fff}header .btn.red{background:var(--r);border-color:var(--r)}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:12px;padding:10px 12px}
textarea{min-height:150px;resize:vertical}label.l{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kp div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.fl button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px}.fl button.on{background:#0d0d12;color:#fff;border-color:#0d0d12}
.it{display:flex;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:0 0 10px;align-items:center}
.it img{width:84px;height:62px;object-fit:contain;background:var(--bg);border-radius:10px;flex:none}.it .g{flex:1;min-width:0}.it b{display:block}.it small{color:var(--mu);display:block}
.it .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.it.susp{opacity:.6}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:#e7f6ed;color:var(--ok);margin-right:4px}.tg.s{background:#ffecec;color:var(--r)}.tg.c{background:#f0f0f4;color:#444}
@media (prefers-color-scheme:dark){.tg{background:#12301f}.tg.s{background:#3a1515}.tg.c{background:#26262f;color:#ccc}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 14px}.cd h2{font-size:16px;margin:0 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:6px 0}
.ch{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:5px 6px 5px 12px;margin:3px 4px 3px 0}.ch button{border:0;background:#0001;border-radius:50%;width:22px;height:22px;cursor:pointer;color:inherit}
.fo{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.fo div{position:relative;width:96px}.fo img{width:96px;height:72px;object-fit:contain;background:var(--bg);border:1px solid var(--bd);border-radius:10px}.fo .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--r);color:#fff;cursor:pointer}.fo .m{display:flex;justify-content:space-between;margin-top:2px}.fo .m button{border:0;background:none;color:var(--mu);cursor:pointer;padding:0 6px}
.ms{background:#fff8e1;border:1px solid #f0d98a;color:#5c4400;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}@media (prefers-color-scheme:dark){.ms{background:#2d2610;border-color:#6b5a1d;color:#f3dd8d}}
.mu{color:var(--mu);font-size:13px}.lg{max-width:380px;margin:12vh auto 0;padding:0 16px}.lg h1{font-size:24px}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px}.ck input{width:auto;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#17171c;color:#fff;padding:10px 18px;border-radius:999px;z-index:50;display:none;max-width:92vw;text-align:center}

.nav{display:flex;gap:6px;overflow-x:auto;width:100%;padding-top:2px}.nav button{border:1px solid #33333f;background:#1d1d26;color:#fff;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer;white-space:nowrap}.nav button.on{background:var(--r);border-color:var(--r)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}.md{background:var(--cd);color:var(--tx);width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
.md h2{margin:0 0 4px;font-size:19px}.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:12px 0;font-size:14px}.dl dt{color:var(--mu)}.dl dd{margin:0;word-break:break-all}
.lk{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:6px 0}.lk div{flex:1;min-width:0}.lk b{display:block;font-size:13px}.lk small{color:var(--mu);word-break:break-all}
.sec{background:#fff8e1;border:1px solid #f0d98a;color:#5c4400;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}@media (prefers-color-scheme:dark){.sec{background:#2d2610;border-color:#6b5a1d;color:#f3dd8d}}
.pw{font:700 20px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;background:var(--bg);border:1px dashed var(--r);border-radius:12px;padding:10px;text-align:center;margin:8px 0;word-break:break-all}
.rk{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 8px}.rk .n{font-size:20px;font-weight:800;text-align:center}.rk .b{height:8px;border-radius:99px;background:var(--bg);margin:6px 0;overflow:hidden}.rk .b i{display:block;height:100%;background:var(--r)}
.pd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 10px}.pd .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pd small{color:var(--mu)}.pd dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13.5px;margin:8px 0}.pd dt{color:var(--mu)}.pd dd{margin:0;word-break:break-word}
@media (max-width:560px){.kp{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.it{flex-wrap:wrap}.it .ac{width:100%;justify-content:flex-start}}
</style>
</head>

/* ---------- login ---------- */
function login(msg){
  $('#app').innerHTML=head('Acesso restrito',true)+`<div class="lg"><h1>Administrador geral</h1>${msg?`<div class="ms">${esc(msg)}</div>`:''}
  <input id="em" type="email" placeholder="E-mail" autocomplete="username" aria-label="E-mail"><div style="height:8px"></div>
  <input id="se" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha" onkeydown="event.key==='Enter'&&doLogin()"><div style="height:12px"></div>
  <button class="btn red" style="width:100%" onclick="doLogin()">Entrar</button></div>`}
async function doLogin(){
  const email=$('#em').value.trim(),password=$('#se').value;if(!email||!password)return toast('Informe e-mail e senha');
  const{error}=await sb.auth.signInWithPassword({email,password});if(error)return toast('E-mail ou senha incorretos');
  start()}
async function sair(){await sb.auth.signOut();login()}
async function start(){
  const{data:s}=await sb.auth.getSession();if(!s||!s.session)return login();
  const{data:dono,error}=await sb.rpc('sou_dono');
  if(error||!dono){await sb.auth.signOut();return login('Este login não é do administrador geral. Cadastre o e-mail do dono no banco (tabela donos) e entre de novo.')}
  await load()}

/* ---------- lista ---------- */
async function load(){
  TAB='catalogo';
  $('#app').innerHTML=head()+'<div class="w"><p class="mu" style="margin-top:20px">Carregando catálogo…</p></div>';
  const[a,b,hh]=await Promise.all([sb.from('catalogo_mestre').select('*').order('ordem').order('created_at'),sb.rpc('mestre_estatisticas'),sb.rpc('site_sync_historico')]);
  H=(hh&&hh.data)||[];
  if(a.error){$('#app').innerHTML=head('',true)+`<div class="w"><div class="ms" style="margin-top:20px">Não consegui carregar o catálogo geral: ${esc(a.error.message)}.<br>Rode o SQL do catálogo geral no Supabase e recarregue.</div></div>`;return}
  C=a.data||[];ST={vendedores:0,motos:{}};
  if(b.data){ST.vendedores=b.data.vendedores||0;(b.data.motos||[]).forEach(x=>ST.motos[x.id]=x)}
  lista()}
function minP(m){const p=(m.planos||[]).filter(x=>x.valor>0).sort((x,y)=>x.valor-y.valor)[0];return p?`${p.parcelas}x ${brl(p.valor)}`:'—'}
function lista(){
  const cats=['Todas',...[...new Set([...CATS0,...C.map(m=>m.categoria).filter(Boolean)])]];
  const q=nz(F.q);
  const f=C.filter(m=>(F.cat==='Todas'||m.categoria===F.cat)&&(F.st==='todas'||(F.st==='ativas'?m.ativo:!m.ativo))&&(!q||nz(m.nome+' '+(m.modelo||'')).includes(q)));
  const ativas=C.filter(m=>m.ativo).length;
  $('#app').innerHTML=head()+`<div class="w">
  <div class="kp"><div><b>${ST.vendedores}</b><span>vendedores</span></div><div><b>${C.length}</b><span>motos no catálogo</span></div><div><b>${ativas}</b><span>ativas</span></div><div><b>${C.length-ativas}</b><span>suspensas</span></div></div>
  <div class="fl"><button class="btn red sm" style="border-radius:999px;color:#fff;background:var(--r)" onclick="novo()">+ Nova moto</button><button onclick="syncSite()">⟳ Atualizar do site agora</button><button onclick="trocaSenha()">🔑 Alterar minha senha</button><button onclick="sincro()">↻ Sincronizar vendedores</button><button onclick="sair()">Sair</button></div>
  ${faixa()}
  <input id="bq" type="search" placeholder="Buscar moto" value="${esc(F.q)}" oninput="F.q=this.value;lista2()">
  <div class="fl">${cats.map(c=>`<button class="${F.cat===c?'on':''}" onclick="F.cat='${esc(c)}';lista()">${esc(c)}</button>`).join('')}</div>
  <div class="fl">${[['todas','Todas'],['ativas','Ativas'],['susp','Suspensas']].map(a=>`<button class="${F.st===a[0]?'on':''}" onclick="F.st='${a[0]}';lista()">${a[1]}</button>`).join('')}</div>
  <p class="mu">O que você alterar aqui muda automaticamente em <b>todos</b> os sites. Campos que um vendedor personalizou ficam protegidos, a menos que você use “forçar em todos”. Exceção: planos e valores do consórcio são sempre os do catálogo (o vendedor não edita).</p>
  <div id="ls">${f.map(card).join('')||'<p class="mu">Nenhuma moto.</p>'}</div></div>`;
  const q2=$('#bq');if(q2&&document.activeElement!==q2){}}
function lista2(){const q=nz(F.q);const f=C.filter(m=>(F.cat==='Todas'||m.categoria===F.cat)&&(F.st==='todas'||(F.st==='ativas'?m.ativo:!m.ativo))&&(!q||nz(m.nome+' '+(m.modelo||'')).includes(q)));$('#ls').innerHTML=f.map(card).join('')||'<p class="mu">Nenhuma moto.</p>'}
function card(m){
  const s=ST.motos[m.id]||{vendedores:0,personalizados:0},f0=(m.fotos||[])[0];
  return `<div class="it ${m.ativo?'':'susp'}">${f0?`<img src="${esc(f0)}" alt="" loading="lazy">`:'<img alt="">'}
  <div class="g"><b>${esc(m.nome)}${m.modelo?' '+esc(m.modelo):''}</b><small>${esc(m.categoria||'Sem categoria')} · consórcio a partir de ${esc(minP(m))} · à vista ${m.preco?brl(m.preco):'não informado'}</small>
  <small>${m.ativo?'<span class="tg">ATIVA</span>':'<span class="tg s">SUSPENSA</span>'}<span class="tg c">${(m.cores||[]).length} cor(es)</span><span class="tg c">${m.sync_site===false?'planos manuais':'planos do site'}</span><span class="tg c">${s.vendedores} vendedor(es)</span>${s.personalizados?`<span class="tg c">${s.personalizados} personalizado(s)</span>`:''}</small></div>
  <div class="ac"><button class="btn sm" onclick="mv('${m.id}',-1)" title="Subir">↑</button><button class="btn sm" onclick="mv('${m.id}',1)" title="Descer">↓</button><button class="btn red sm" onclick="edit('${m.id}')">Editar</button><button class="btn sm" onclick="susp('${m.id}',${m.ativo})">${m.ativo?'Suspender':'Reativar'}</button></div></div>`}
async function mv(id,d){const i=C.findIndex(m=>m.id===id),j=i+d;if(j<0||j>=C.length)return;[C[i],C[j]]=[C[j],C[i]];
  await Promise.all(C.map((m,k)=>{if(m.ordem===k)return;m.ordem=k;return sb.rpc('mestre_salvar',{p_id:m.id,p:{ordem:k},p_forcar:false})}));lista();toast('Ordem salva (vale para vendedores novos e motos novas)')}
async function susp(id,ativa){
  const m=C.find(x=>x.id===id);
  if(!confirm(ativa?`Suspender “${m.nome}” em TODOS os sites dos vendedores? Ela some da vitrine de todos e eles não conseguem reativar.`:`Reativar “${m.nome}” em todos os sites?`))return;
  const{data,error}=await sb.rpc('mestre_suspender',{p_id:id,p_suspender:!!ativa});if(error)return toast('Erro: '+error.message);toast(data);load()}
async function sincro(){
  if(!confirm('Verificar todos os vendedores e criar as motos do catálogo que faltarem? Não altera nada que já existe.'))return;
  const{data,error}=await sb.rpc('mestre_sincronizar_todos');if(error)return toast('Erro: '+error.message);alert(data);load()}



async function trocaSenha(){
  const n=prompt('Nova senha de acesso do admin geral (mínimo 8 caracteres):');if(n===null)return;
  if(n.length<8)return toast('A senha precisa ter pelo menos 8 caracteres');
  if(prompt('Repita a nova senha:')!==n)return toast('As senhas não conferem');
  const{error}=await sb.auth.updateUser({password:n});toast(error?'Erro: '+error.message:'Senha alterada com sucesso!')}


/* ---------- configurações gerais: vídeo "Como funciona o consórcio" (vale para TODOS os vendedores) ---------- */
function cfVid(u){
  if(!u)return'<p class="mu">Nenhum vídeo definido: o botão “Como funciona” não aparece nos sites.</p>';
  const vm=/vimeo\.com\/(?:video\/)?(\d+)/.exec(u),y=/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/.exec(u);
  if(vm)return`<iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000"></iframe>`;
  if(y)return`<iframe src="https://www.youtube.com/embed/${y[1]}" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000"></iframe>`;
  return`<video controls playsinline src="${esc(u)}" style="width:100%;aspect-ratio:16/9;border-radius:14px;background:#000"></video>`}
async function config(){
  TAB='config';$('#app').innerHTML=head()+'<div class="w"><p class="mu" style="margin-top:20px">Carregando…</p></div>';
  const r=await sb.rpc('config_publica');const c=(r&&r.data)||{};
  $('#app').innerHTML=head()+`<div class="w" style="padding-top:14px"><div class="cd"><h2>Vídeo “Como funciona o consórcio”</h2>
  <p class="mu">Aparece em <b>todos os sites dos vendedores</b>: botão <b>▶ Como funciona</b> no topo e dentro do detalhe de cada moto. Cole o link do YouTube ou do Vimeo, ou envie um vídeo (MP4 ou WebM).</p>
  <label class="l" for="cf_t">Título da janela do vídeo</label><input id="cf_t" value="${esc(c.video_titulo||'Como funciona o consórcio Honda')}">
  <label class="l" for="cf_v">Link do vídeo</label><input id="cf_v" placeholder="https://www.youtube.com/watch?v=..." value="${esc(c.video_como_funciona||'')}" oninput="$('#cf_p').innerHTML=cfVid(this.value.trim())">
  <div style="margin-top:12px"><input id="cf_f" type="file" accept="video/mp4,video/webm" onchange="cfUp(this.files[0])"><p class="mu">Ou envie do aparelho (até 50 MB).</p></div>
  <div id="cf_p" style="margin-top:10px">${cfVid(c.video_como_funciona||'')}</div>
  <div class="bar"><button class="btn red" onclick="cfSalva()">Salvar para todos os vendedores</button><button class="btn" onclick="cfLimpa()">Remover vídeo</button></div></div></div>`}
async function cfUp(f){
  if(!f)return;if(f.size>50*1024*1024)return toast('O vídeo passa de 50 MB: envie um arquivo menor ou use um link do YouTube');
  toast('Enviando vídeo…');
  const ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4',path='mestre/video-'+(crypto.randomUUID?crypto.randomUUID():Date.now())+'.'+ext;

  <div class="cd"><h2>Cores disponíveis</h2><p class="mu">Só estas cores aparecem para o cliente escolher nos formulários e no chat. Deixe vazio se não quiser limitar.</p>
   <div id="cores"></div><div class="row" style="grid-template-columns:1fr auto"><input id="nc" placeholder="Ex.: Prata" onkeydown="if(event.key==='Enter'){event.preventDefault();addCor()}"><button class="btn" onclick="addCor()">Adicionar cor</button></div></div>
  <div class="cd"><h2>Consórcio (planos e parcelas)</h2>${NEW?'':`<label class="ck" style="margin:6px 0 10px"><input type="checkbox" ${E.sync_site!==false?'checked':''} onchange="E.sync_site=this.checked"><span><b>Atualizar estes planos automaticamente do site todo dia</b><br><small class="mu">Desligue se você quiser manter os valores digitados aqui.</small></span></label>`}<p class="mu">Cada linha é uma opção: número de parcelas e valor da parcela.</p>
   <div id="planos"></div><div class="fl"><button onclick="addPlano()">+ Adicionar plano</button><button onclick="ordenaPlanos()">Ordenar (mais parcelas primeiro)</button></div>
   <div class="row" style="grid-template-columns:1fr auto;align-items:end"><div><label class="l" for="pct">Reajustar todos os valores em %</label><input id="pct" inputmode="decimal" placeholder="Ex.: 3 ou -2,5"></div><button class="btn" onclick="reajusta()">Aplicar %</button></div></div>
  <div class="cd"><h2>Fotos</h2><div class="fo" id="fotos"></div>
   <div class="row" style="grid-template-columns:1fr auto"><input id="nf" placeholder="Colar link de uma foto" onkeydown="if(event.key==='Enter'){event.preventDefault();addFoto()}"><button class="btn" onclick="addFoto()">Adicionar link</button></div>
   <div style="margin-top:10px"><input id="up" type="file" accept="image/*" multiple onchange="subir(this.files)"><p class="mu">Ou envie do aparelho. A primeira foto é a principal.</p></div></div>
  <div class="cd"><h2>Descrição / ficha técnica</h2><textarea id="e_desc" oninput="E.descricao=this.value">${esc(E.descricao)}</textarea></div>
  <div class="bar">${NEW?'':`<label class="ck"><input id="fc" type="checkbox"><span>Forçar em todos os vendedores (sobrescreve também o que o vendedor personalizou)</span></label>`}
   <button class="btn red" onclick="salvar()">${NEW?'Criar e enviar para todos':'Salvar e atualizar todos'}</button></div></div>`;
  rCores();rPlanos();rFotos()}
function voltar(){if(JSON.stringify(norm(E))!==E0&&!confirm('Descartar as alterações?'))return;lista()}
const rCores=()=>{$('#cores').innerHTML=E.cores.map((c,i)=>`<span class="ch">${esc(c)}<button onclick="E.cores.splice(${i},1);rCores()" aria-label="Remover">×</button></span>`).join('')||'<p class="mu">Nenhuma cor cadastrada.</p>'};
function addCor(){const v=$('#nc').value.trim();if(!v)return;if(!E.cores.some(c=>nz(c)===nz(v)))E.cores.push(v.charAt(0).toUpperCase()+v.slice(1));$('#nc').value='';rCores()}
const rPlanos=()=>{$('#planos').innerHTML=E.planos.map((p,i)=>`<div class="pr"><input inputmode="numeric" placeholder="Parcelas" value="${esc(p.parcelas)}" oninput="E.planos[${i}].parcelas=this.value"><input inputmode="decimal" placeholder="Valor da parcela (R$)" value="${esc(p.valor)}" oninput="E.planos[${i}].valor=this.value.replace(',','.')"><button class="btn sm" onclick="E.planos.splice(${i},1);rPlanos()" aria-label="Remover">×</button></div>`).join('')||'<p class="mu">Sem planos: o site mostra “Consulte as condições”.</p>'};
const addPlano=()=>{E.planos.push({parcelas:'',valor:''});rPlanos()};
const ordenaPlanos=()=>{E.planos.sort((a,b)=>(+b.parcelas)-(+a.parcelas));rPlanos()};
function reajusta(){const p=parseFloat(String($('#pct').value).replace(',','.'));if(isNaN(p))return toast('Informe o percentual');
  E.planos.forEach(x=>{if(+x.valor>0)x.valor=Math.round(+x.valor*(1+p/100)*100)/100});rPlanos();toast('Valores reajustados em '+p+'% (confira antes de salvar)')}
const rFotos=()=>{$('#fotos').innerHTML=E.fotos.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button class="x" onclick="E.fotos.splice(${i},1);rFotos()" aria-label="Remover">×</button><span class="m"><button onclick="mvf(${i},-1)">←</button><button onclick="mvf(${i},1)">→</button></span></div>`).join('')||'<p class="mu">Sem fotos.</p>'};
function mvf(i,d){const j=i+d;if(j<0||j>=E.fotos.length)return;[E.fotos[i],E.fotos[j]]=[E.fotos[j],E.fotos[i]];rFotos()}
function addFoto(){const v=$('#nf').value.trim();if(!/^https?:\/\//i.test(v))return toast('Cole um link que comece com https://');E.fotos.push(v);$('#nf').value='';rFotos()}
async function subir(files){
  for(const f of files){const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path='mestre/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2))+'.'+ext;
    const{error}=await sb.storage.from('midia').upload(path,f,{contentType:f.type||'image/jpeg',upsert:false});
    if(error){toast('Não consegui enviar '+f.name+': '+error.message);continue}
    E.fotos.push(sb.storage.from('midia').getPublicUrl(path).data.publicUrl)}
  rFotos();$('#up').value=''}
async function salvar(){
  const n=norm(E);if(!n.nome)return toast('Informe o nome da moto');
  const ruins=(E.planos||[]).filter(p=>(p.parcelas!==''||p.valor!=='')&&!(+p.parcelas>0&&+p.valor>0));if(ruins.length)return toast('Há plano incompleto: preencha parcelas e valor ou remova a linha');
  if(NEW){const{data,error}=await sb.rpc('mestre_adicionar',{p:n});if(error)return toast('Erro: '+error.message);toast('Moto criada e enviada para todos os vendedores');return load()}
  const o=JSON.parse(E0),p={};Object.keys(n).forEach(k=>{if(JSON.stringify(n[k])!==JSON.stringify(o[k]))p[k]=n[k]});
  if(!Object.keys(p).length)return toast('Nada foi alterado');
  if(p.planos&&n.sync_site&&p.sync_site===undefined&&confirm('Você alterou os planos, mas esta moto está com a atualização automática do site LIGADA: na próxima rodada o site sobrescreve o que você digitou.\n\nOK = desligar a atualização automática desta moto e manter o seu valor.\nCancelar = continuar ligada.'))p.sync_site=false;
  const forcar=!!($('#fc')&&$('#fc').checked);
  if(forcar&&!confirm('Forçar sobrescreve também o que os vendedores personalizaram nesses campos. Continuar?'))return;
  const{data,error}=await sb.rpc('mestre_salvar',{p_id:EID,p,p_forcar:forcar});if(error)return toast('Erro: '+error.message);
  alert(data);load()}
sb.auth.getSession().then(r=>r.data&&r.data.session?start():login());
</script>
</body>
</html>
